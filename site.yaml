AWSTemplateFormatVersion: "2010-09-09"
Description: >
  little.tools — a private S3 bucket behind CloudFront, and a role GitHub
  Actions can assume to publish into it. Nothing sits in the request path:
  readers are served a static object from an edge cache, so a failed build
  leaves the last good page in place. The build itself lives in the repository,
  not here.

  Deploy this wherever the bucket should live — everything else in it is global.
  The certificate is the one piece that has to be in us-east-1, and it is its own
  stack for exactly that reason.

Parameters:
  DomainName:
    Type: String
    Default: little.tools
  HostedZoneId:
    Type: String
    Description: From the dns stack's output.
  CertificateArn:
    Type: String
    Description: From the cert stack's output. Must be a certificate in us-east-1.
  GitHubRepo:
    Type: String
    Default: nemecec/little-tools
    Description: owner/name of the repository allowed to publish. Nothing else can.
  GitHubBranch:
    Type: String
    Default: main
    Description: The only branch whose workflows may assume the publish role.
  CreateOidcProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >
      An account holds one GitHub OIDC provider. Answer "no" if another stack in
      this account already created it.

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, "yes"]

Resources:

  # ---------------------------------------------------------------- content --
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "site", !Ref "AWS::AccountId"]]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ------------------------------------------------------------- delivery ----
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "oac"]]
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # A REST origin serves exactly the key it is asked for, so /timetable and
  # /timetable/ have to be turned into the index object here.
  IndexRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "index-rewrite"]]
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve directory-style paths to their index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') <= uri.lastIndexOf('/')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingOptimized, AWS managed
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewrite.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  ApexRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2      # the fixed zone id for CloudFront
            EvaluateTargetHealth: false
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

  # -------------------------------------------------------------- publish ----
  # GitHub Actions authenticates with a short-lived OIDC token, so there is no
  # access key anywhere: not in the repository, not in a secret, not on a laptop.
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "publish"]]
      Description: Assumed by the repository's publish workflow
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidc
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # GitHub has begun issuing subjects with immutable numeric ids
                # appended to both names — repo:owner@1180780/name@1343690401:… —
                # which the snippet everyone copies never matches. Accept that
                # form as well as the plain one. The wildcards cover only the
                # ids: a "@" cannot appear in a real owner or repository name,
                # so this widens nothing.
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
                  - !Sub
                    - "repo:${Owner}@*/${Name}@*:ref:refs/heads/${GitHubBranch}"
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        - PolicyName: publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  PublishRoleArn:
    Value: !GetAtt PublishRole.Arn
  SiteUrl:
    Value: !Sub "https://${DomainName}/"
