AWSTemplateFormatVersion: "2010-09-09"
Description: >
  little.tools — a private S3 bucket behind CloudFront, and a role GitHub
  Actions can assume to publish into it. Nothing sits in the request path:
  readers are served a static object from an edge cache, so a failed build
  leaves the last good page in place. The build itself lives in the repository,
  not here.

  Deploy this wherever the bucket should live — everything else in it is global.
  The certificate is the one piece that has to be in us-east-1, and it is its own
  stack for exactly that reason.

Parameters:
  DomainName:
    Type: String
    Default: little.tools
  HostedZoneId:
    Type: String
    Description: From the dns stack's output.
  CertificateArn:
    Type: String
    Description: From the cert stack's output. Must be a certificate in us-east-1.
  GitHubRepo:
    Type: String
    Default: nemecec/little-tools
    Description: owner/name of the repository allowed to publish. Nothing else can.
  GitHubBranch:
    Type: String
    Default: main
    Description: The only branch whose workflows may assume the publish role.
  Schedule:
    Type: String
    Default: cron(20 3 * * ? *)
    Description: >
      When to rebuild. On AWS rather than in the repository, because GitHub
      switches a scheduled workflow off after sixty days of quiet and this one
      would have nothing to be busy about.
  CreateOidcProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >
      An account holds one GitHub OIDC provider. Answer "no" if another stack in
      this account already created it.

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, "yes"]

Resources:

  # ---------------------------------------------------------------- content --
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "site", !Ref "AWS::AccountId"]]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ------------------------------------------------------------- delivery ----
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "oac"]]
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # A REST origin serves exactly the key it is asked for, so /timetable and
  # /timetable/ have to be turned into the index object here.
  IndexRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "index-rewrite"]]
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve directory-style paths to their index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') <= uri.lastIndexOf('/')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # A page this simple can say exactly what it is allowed to do, which turns any
  # future injection into a defacement rather than script execution. It is one
  # self-contained file: the only things it fetches are the counter's script and
  # the beacon it sends. 'unsafe-inline' is unavoidable — the whole page is
  # inline by design — so the policy earns its keep on the other directives.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "headers"]]
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'none';
              script-src 'unsafe-inline' https://gc.zgo.at;
              style-src 'unsafe-inline';
              img-src 'self' data: https://*.goatcounter.com;
              connect-src https://*.goatcounter.com;
              form-action 'none';
              frame-ancestors 'none';
              base-uri 'none'
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        DefaultRootObject: index.html
        # HTTP/2 only. Advertising HTTP/3 makes a browser try QUIC over UDP, and
        # a network that passes TCP happily may drop or mangle that — corporate
        # VPNs are the usual culprit. The browser then caches the advertisement
        # for a day and keeps retrying, so the page fails intermittently with
        # ERR_QUIC_PROTOCOL_ERROR while every other check looks healthy. There
        # is nothing to win here: this is one small file behind a cache.
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingOptimized, AWS managed
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewrite.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  ApexRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2      # the fixed zone id for CloudFront
            EvaluateTargetHealth: false
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

  # -------------------------------------------------------------- publish ----
  # GitHub Actions authenticates with a short-lived OIDC token, so there is no
  # access key anywhere: not in the repository, not in a secret, not on a laptop.
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # Left to itself CloudFormation fills in a thumbprint of its own choosing,
      # and a token signed under a different chain is then rejected with nothing
      # more helpful than "could not be validated". These are GitHub's.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # -------------------------------------------------------- scheduled build --
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "build"]]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ["", ["/aws/lambda/", !Join ["-", !Split [".", !Ref DomainName]], "-build"]]
      RetentionInDays: 30

  # The real code is pushed by deploy.sh: a template's inline body is capped at
  # 4 KB and the generator alone is twenty times that.
  BuildFunction:
    Type: AWS::Lambda::Function
    DependsOn: BuildLogs
    Properties:
      FunctionName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "build"]]
      Runtime: python3.13
      Handler: lambda_function.handler
      Role: !GetAtt BuildRole.Arn
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          BUCKET: !Ref Bucket
          DISTRIBUTION: !Ref Distribution
      Code:
        ZipFile: |
          def handler(event, context):
              raise RuntimeError("placeholder — run deploy.sh to push the real code")

  BuildSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "rebuild"]]
      Description: Rebuild the timetable from the school's public data
      ScheduleExpression: !Ref Schedule
      State: ENABLED
      Targets:
        - Id: build
          Arn: !GetAtt BuildFunction.Arn

  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BuildFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BuildSchedule.Arn

  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "publish"]]
      Description: Assumed by the repository's workflow, to ask for a rebuild
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidc
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # GitHub has begun issuing subjects with immutable numeric ids
                # appended to both names — repo:owner@1180780/name@1343690401:… —
                # which the snippet everyone copies never matches. Accept that
                # form as well as the plain one. The wildcards cover only the
                # ids: a "@" cannot appear in a real owner or repository name,
                # so this widens nothing.
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
                  - !Sub
                    - "repo:${Owner}@*/${Name}@*:ref:refs/heads/${GitHubBranch}"
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        # Asking for a rebuild is all the repository can do. It cannot write to
        # the bucket, and it cannot reach anything else in the account.
        - PolicyName: ask-for-a-rebuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BuildFunction.Arn

Outputs:
  BuildFunctionName:
    Value: !Ref BuildFunction
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  PublishRoleArn:
    Value: !GetAtt PublishRole.Arn
  SiteUrl:
    Value: !Sub "https://${DomainName}/"
