AWSTemplateFormatVersion: "2010-09-09"
Description: >
  little.tools — a private S3 bucket behind CloudFront, and a role GitHub
  Actions can assume to publish into it. Nothing sits in the request path:
  readers are served a static object from an edge cache, so a failed build
  leaves the last good page in place. The build itself lives in the repository,
  not here.

  Deploy this wherever the bucket should live — everything else in it is global.
  The certificate is the one piece that has to be in us-east-1, and it is its own
  stack for exactly that reason.

Parameters:
  DomainName:
    Type: String
    Default: little.tools
  HostedZoneId:
    Type: String
    Description: From the dns stack's output.
  CertificateArn:
    Type: String
    Description: From the cert stack's output. Must be a certificate in us-east-1.
  GitHubRepo:
    Type: String
    Default: nemecec/little-tools
    Description: owner/name of the repository allowed to publish. Nothing else can.
  GitHubBranch:
    Type: String
    Default: main
    Description: The only branch whose workflows may assume the publish role.
  AlarmEmail:
    Type: String
    Default: ""
    Description: >
      Where to write when the nightly build fails. Empty means no alarm and no
      topic — the site then goes stale in silence, which is the default only
      because an address cannot be guessed. AWS sends a confirmation mail that
      has to be clicked before anything is delivered.
  CounterSite:
    Type: String
    Default: ""
    Description: >
      The GoatCounter site code, if visits are counted. Only this one subdomain
      is then allowed to be reached; goatcounter.com hands anyone a subdomain,
      so a wildcard would leave a ready-made place to send data to. Empty
      forbids the host outright.
  ReportErrors:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >
      Whether the page may report its own faults. A fault otherwise leaves a
      half-drawn page and nobody hears about it. The report carries the error,
      the browser and the settings with every typed word replaced by its
      length. It goes to this account's own logs, not to anybody else's.
  Schedule:
    Type: String
    Default: cron(20 3 * * ? *)
    Description: >
      When to rebuild. On AWS rather than in the repository, because GitHub
      switches a scheduled workflow off after sixty days of quiet and this one
      would have nothing to be busy about.
  CreateOidcProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >
      An account holds one GitHub OIDC provider. Answer "no" if another stack in
      this account already created it.

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, "yes"]
  Counting: !Not [!Equals [!Ref CounterSite, ""]]
  Alarming: !Not [!Equals [!Ref AlarmEmail, ""]]
  Reporting: !Equals [!Ref ReportErrors, "yes"]
  ReportingAlarm: !And [!Condition Reporting, !Condition Alarming]

Resources:

  # ---------------------------------------------------------------- content --
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "site", !Ref "AWS::AccountId"]]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ------------------------------------------------------------- delivery ----
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "oac"]]
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # A REST origin serves exactly the key it is asked for, so /timetable and
  # /timetable/ have to be turned into the index object here.
  IndexRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "index-rewrite"]]
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve directory-style paths to their index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') <= uri.lastIndexOf('/')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # What the page is allowed to reach. Be clear about what this does and does
  # not buy: 'unsafe-inline' is in script-src because the whole page is one
  # inline file, and that means the policy does NOT stop injected markup from
  # executing. Escaping in page.js is what stops that; this is not a second
  # line of defence behind it.
  #
  # What the policy does buy is that nothing can be *fetched* or *sent* anywhere
  # unnamed: no third-party script beyond the counter, no image or beacon to an
  # address that is not written here, no form post, no framing, no <base>. So an
  # injection that does execute still cannot get anything out.
  #
  # The counter's host is named exactly, not by wildcard: goatcounter.com hands
  # out subdomains to anyone, so `https://*.goatcounter.com` would name an
  # exfiltration endpoint that is inside the policy.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "headers"]]
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub
              - >-
                default-src 'none';
                script-src 'unsafe-inline' ${Counter};
                style-src 'unsafe-inline';
                img-src 'self' data: ${Beacon};
                connect-src ${Connect};
                form-action 'none';
                frame-ancestors 'none';
                base-uri 'none'
              - Counter: !If [Counting, "https://gc.zgo.at", "'none'"]
                # The page posts a fault to its own origin. 'self' is added
                # only when there is something there to post to.
                Connect: !If
                  - Reporting
                  - !If [Counting, !Sub "'self' https://${CounterSite}.goatcounter.com", "'self'"]
                  - !If [Counting, !Sub "https://${CounterSite}.goatcounter.com", "'none'"]
                Beacon: !If
                  - Counting
                  - !Sub "https://${CounterSite}.goatcounter.com"
                  - "'none'"
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        DefaultRootObject: index.html
        # HTTP/2 only. Advertising HTTP/3 makes a browser try QUIC over UDP, and
        # a network that passes TCP happily may drop or mangle that — corporate
        # VPNs are the usual culprit. The browser then caches the advertisement
        # for a day and keeps retrying, so the page fails intermittently with
        # ERR_QUIC_PROTOCOL_ERROR while every other check looks healthy. There
        # is nothing to win here: this is one small file behind a cache.
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        # The report origin is listed whole rather than appended, because a
        # list cannot hold a condition. Both entries move together.
        Origins: !If
          - Reporting
          - - Id: s3
              DomainName: !GetAtt Bucket.RegionalDomainName
              OriginAccessControlId: !GetAtt OriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
            - Id: report
              DomainName: !Sub "${ReportApi}.execute-api.${AWS::Region}.amazonaws.com"
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
              # What tells the function the call came through CloudFront.
              OriginCustomHeaders:
                - HeaderName: x-report-gate
                  HeaderValue: !Select [2, !Split ["/", !Ref AWS::StackId]]
          - - Id: s3
              DomainName: !GetAtt Bucket.RegionalDomainName
              OriginAccessControlId: !GetAtt OriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
        CacheBehaviors: !If
          - Reporting
          - - PathPattern: report
              TargetOriginId: report
              ViewerProtocolPolicy: https-only
              # POST is the one that matters. CloudFront will not allow it on
              # its own, so the whole write set comes with it.
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachedMethods: [GET, HEAD]
              # CachingDisabled and AllViewerExceptHostHeader, both AWS managed.
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingOptimized, AWS managed
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewrite.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  ApexRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2      # the fixed zone id for CloudFront
            EvaluateTargetHealth: false
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

  # -------------------------------------------------------------- publish ----
  # GitHub Actions authenticates with a short-lived OIDC token, so there is no
  # access key anywhere: not in the repository, not in a secret, not on a laptop.
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # Left to itself CloudFormation fills in a thumbprint of its own choosing,
      # and a token signed under a different chain is then rejected with nothing
      # more helpful than "could not be validated". These are GitHub's.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # -------------------------------------------------------- scheduled build --
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "build"]]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ["", ["/aws/lambda/", !Join ["-", !Split [".", !Ref DomainName]], "-build"]]
      RetentionInDays: 30

  # The real code is pushed by deploy.sh: a template's inline body is capped at
  # 4 KB and the generator alone is twenty times that.
  BuildFunction:
    Type: AWS::Lambda::Function
    DependsOn: BuildLogs
    Properties:
      FunctionName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "build"]]
      Runtime: python3.13
      Handler: lambda_function.handler
      Role: !GetAtt BuildRole.Arn
      Timeout: 900
      MemorySize: 512
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          BUCKET: !Ref Bucket
          DISTRIBUTION: !Ref Distribution
      Code:
        ZipFile: |
          def handler(event, context):
              raise RuntimeError("placeholder — run deploy.sh to push the real code")

  # A page nobody is watching goes stale without saying so: EventBridge invokes
  # asynchronously, retries twice, and then drops the failure on the floor. This
  # is the only thing that speaks up. It needs somewhere to speak to, so it is
  # only created when an address is given — see AlarmEmail.
  BuildAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: Alarming
    Properties:
      TopicName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "build-alarm"]]
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  BuildFailed:
    Type: AWS::CloudWatch::Alarm
    Condition: Alarming
    Properties:
      AlarmName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "build-failed"]]
      AlarmDescription: >-
        The nightly timetable build errored. The site keeps serving the last
        good page, so nothing is down — but it is no longer being updated.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BuildFunction
      Statistic: Sum
      # An hour, not a day. The build runs once a night, so the point of this is
      # to say so within the hour rather than whenever the day's bucket happens
      # to close — a day-long period is slow to notice and just as slow to
      # clear, which leaves it sitting in ALARM long after the cause is gone.
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # The 23 hours a day it is not running are not failures. Nor is a night
      # the schedule never fired: that is a different fault from the build
      # breaking, and this alarm does not claim to catch it.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BuildAlarmTopic]

  # ----------------------------------------------------------------- faults --
  #
  # The page tells this endpoint when it breaks. Three things shape it.
  #
  # It is same-origin: CloudFront serves /report from this function, so the
  # policy that lets the page reach nothing at all still lets it reach here,
  # and no third party is handed the reader's data.
  #
  # The way in is an HTTP API, and it took two tries to learn why. A Lambda
  # function URL is the smaller thing and was the first choice. It cannot be
  # reached without authentication here — this account is in an organization
  # that forbids that — and CloudFront cannot supply the authentication either,
  # because its signature does not cover a request body, which is the whole
  # payload. An HTTP API has neither limit.
  #
  # The API is reachable by anyone who finds it, so a header CloudFront alone
  # adds is what the function answers to. That is a gate on noise, not a secret
  # worth guarding: the worst a leak buys is a log line.
  #
  # The reader's own words never arrive. The page replaces them with their
  # length before it sends. See scrubbed() in page.js.
  ReportLogs:
    Type: AWS::Logs::LogGroup
    Condition: Reporting
    Properties:
      LogGroupName: !Join ["", ["/aws/lambda/", !Join ["-", !Split [".", !Ref DomainName]], "-report"]]
      # A fault is worth reading while it is still happening, and worth nothing
      # a fortnight later. Short retention also caps what a flood can cost.
      RetentionInDays: 14

  ReportRole:
    Type: AWS::IAM::Role
    Condition: Reporting
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-its-own-log
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ReportLogs.Arn
      # Nothing else. It writes a line and returns: no bucket, no distribution,
      # no way to reach anything this account holds.

  ReportFunction:
    Type: AWS::Lambda::Function
    Condition: Reporting
    DependsOn: ReportLogs
    Properties:
      FunctionName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "report"]]
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt ReportRole.Arn
      Timeout: 5
      MemorySize: 128
      # One at a time. A page in a repaint loop, or somebody who finds the
      # address, then costs a queue rather than a bill.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          GATE: !Select [2, !Split ["/", !Ref AWS::StackId]]
      Code:
        ZipFile: |
          import json, os

          GATE = os.environ["GATE"]
          CAP = 8000     # a report is a few hundred bytes; this is the ceiling

          def handler(event, _context):
              headers = {k.lower(): v for k, v in (event.get("headers") or {}).items()}
              if headers.get("x-report-gate") != GATE:
                  return {"statusCode": 403}
              body = (event.get("body") or "")[:CAP]
              try:
                  report = json.loads(body)
              except ValueError:
                  return {"statusCode": 400}
              if not isinstance(report, dict) or \
                      report.get("kind") not in ("page-error", "feedback"):
                  return {"statusCode": 400}
              # One line, so a metric filter can count it and a human can read
              # it. The page decides what is in it; nothing is added here.
              print(json.dumps(report, ensure_ascii=False, sort_keys=True)[:CAP])
              return {"statusCode": 204}

  ReportApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: Reporting
    Properties:
      Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "report"]]
      ProtocolType: HTTP

  ReportIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: Reporting
    Properties:
      ApiId: !Ref ReportApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ReportFunction.Arn
      PayloadFormatVersion: "2.0"

  ReportRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: Reporting
    Properties:
      ApiId: !Ref ReportApi
      # One route, one method. Everything else the API answers 404 itself.
      RouteKey: POST /report
      Target: !Join ["/", ["integrations", !Ref ReportIntegration]]

  # $default, so the address carries no stage name and CloudFront can pass the
  # path through unchanged.
  ReportStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: Reporting
    Properties:
      ApiId: !Ref ReportApi
      StageName: $default
      AutoDeploy: true

  ReportPermission:
    Type: AWS::Lambda::Permission
    Condition: Reporting
    Properties:
      FunctionName: !GetAtt ReportFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ReportApi}/*/POST/report"

  # What turns a log line into a mail. The alarm needs somewhere to write, so
  # it exists only when an address was given.
  ReportSeen:
    Type: AWS::Logs::MetricFilter
    Condition: Reporting
    Properties:
      LogGroupName: !Ref ReportLogs
      FilterPattern: '{ $.kind = "page-error" }'
      MetricTransformations:
        - MetricNamespace: !Join ["-", !Split [".", !Ref DomainName]]
          MetricName: PageErrors
          MetricValue: "1"
          DefaultValue: 0

  # Somebody took the trouble to write. It should not sit in a log group
  # nobody opens.
  SaidSomething:
    Type: AWS::Logs::MetricFilter
    Condition: Reporting
    Properties:
      LogGroupName: !Ref ReportLogs
      FilterPattern: '{ $.kind = "feedback" }'
      MetricTransformations:
        - MetricNamespace: !Join ["-", !Split [".", !Ref DomainName]]
          MetricName: Feedback
          MetricValue: "1"
          DefaultValue: 0

  SomebodyWrote:
    Type: AWS::CloudWatch::Alarm
    Condition: ReportingAlarm
    Properties:
      AlarmName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "feedback"]]
      AlarmDescription: >-
        A reader sent feedback from the page. Nothing is broken. Read it in the
        -report log group.
      Namespace: !Join ["-", !Split [".", !Ref DomainName]]
      MetricName: Feedback
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BuildAlarmTopic]

  PageBroke:
    Type: AWS::CloudWatch::Alarm
    Condition: ReportingAlarm
    Properties:
      AlarmName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "page-broke"]]
      AlarmDescription: >-
        The page reported a fault in a reader's browser. The site is up; the
        page is not doing what it should once it gets there. Read the report in
        the -report log group.
      Namespace: !Join ["-", !Split [".", !Ref DomainName]]
      MetricName: PageErrors
      Statistic: Sum
      # An hour. One reader hitting one fault five times is one mail, and a
      # fault nobody hit costs nothing.
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BuildAlarmTopic]

  BuildSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "rebuild"]]
      Description: Rebuild the timetable from the school's public data
      ScheduleExpression: !Ref Schedule
      State: ENABLED
      Targets:
        - Id: build
          Arn: !GetAtt BuildFunction.Arn

  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BuildFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BuildSchedule.Arn

  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join ["-", [!Join ["-", !Split [".", !Ref DomainName]], "publish"]]
      Description: Assumed by the repository's workflow, to ask for a rebuild
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidc
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # GitHub has begun issuing subjects with immutable numeric ids
                # appended to both names — repo:owner@1180780/name@1343690401:… —
                # which the snippet everyone copies never matches. Accept that
                # form as well as the plain one. The wildcards cover only the
                # ids: a "@" cannot appear in a real owner or repository name,
                # so this widens nothing.
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
                  - !Sub
                    - "repo:${Owner}@*/${Name}@*:ref:refs/heads/${GitHubBranch}"
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        # Asking for a rebuild is all the repository can do. It cannot write to
        # the bucket, and it cannot reach anything else in the account.
        - PolicyName: ask-for-a-rebuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BuildFunction.Arn

Outputs:
  BuildFunctionName:
    Value: !Ref BuildFunction
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  PublishRoleArn:
    Value: !GetAtt PublishRole.Arn
  SiteUrl:
    Value: !Sub "https://${DomainName}/"
