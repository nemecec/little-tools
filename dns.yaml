AWSTemplateFormatVersion: "2010-09-09"
Description: >
  little.tools — hosted zone only. Deployed first, on its own, so the nameservers
  can be pointed at Route 53 before anything asks for a certificate: DNS
  validation cannot succeed until the delegation is live, and a stack that waits
  for it sits there for hours.

Parameters:
  DomainName:
    Type: String
    Default: little.tools

Resources:
  Zone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName

  # Which authorities may issue for this name. Without a CAA record the answer
  # is "any of them", so a mis-issued certificate anywhere in the world is a
  # valid certificate for little.tools. The site's own certificate comes from
  # ACM, so that is the only issuer named.
  Caa:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref DomainName
      Type: CAA
      TTL: "3600"
      ResourceRecords:
        - '0 issue "amazon.com"'
        - '0 issuewild ";"'
        - !Sub '0 iodef "mailto:postmaster@${DomainName}"'

Outputs:
  HostedZoneId:
    Value: !Ref Zone
    Export:
      Name: !Sub "${AWS::StackName}-zone-id"
  NameServers:
    Description: Set these as the nameservers for the domain at the registrar.
    Value: !Join [" ", !GetAtt Zone.NameServers]
