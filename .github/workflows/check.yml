name: check

# The templates are deployed by hand and rarely, so a mistake in one is found
# late and in production. These read the templates rather than AWS: no
# credentials, no network, and they finish in a second.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: python3 -m unittest discover -s tests
      - name: The shell is valid shell
        run: bash -n deploy.sh

      - name: Lint the templates
        run: |
          # Pinned like the actions are: an unpinned install is one more thing
          # that can change under the build without anyone choosing it.
          pip install --quiet "cfn-lint==1.55.1"
          cfn-lint cert.yaml --region us-east-1
          cfn-lint dns.yaml site.yaml --region eu-central-1
