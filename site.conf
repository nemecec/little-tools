# Where the site lives. The CloudFormation parameters and the stack names are
# built from it, so it is written once here rather than repeated.
#
# Each tool keeps its own prefix, in its own repository. This file used to carry
# the timetable's, back when the timetable and the site were one thing.
#
# Shell syntax, so deploy.sh can source it. An environment variable of the same
# name wins, for trying something out without editing the file.

DOMAIN=little.tools

# Where the bucket lives, and the stacks that are only bookkeeping. CloudFront,
# Route 53 and IAM are global; the certificate is pinned to us-east-1 because
# CloudFront will not read one from anywhere else.
REGION=eu-central-1

# GoatCounter site code: page views are counted at <code>.goatcounter.com. Not
# a secret — it is in the page source for every visitor. It lives here rather
# than with the tool because the Content-Security-Policy this stack sets has to
# allow it, and a page may only load what the header permits. A tool reads it
# back from the stack's CounterSite output, so the two cannot disagree. Empty
# means no analytics anywhere on the site.
GOATCOUNTER=little-tools-timetable

# Whether a page reports a fault it could not survive. It posts to /report on
# this same site, which a Lambda answers by writing one line to CloudWatch. The
# report holds the error, the browser and the settings, with every word the
# reader typed replaced by its length — the shape of the settings is what a
# fault has to be read against, and the words are nobody's business. Set to no
# and the endpoint is not created and no page posts anywhere.
REPORT_ERRORS=yes
