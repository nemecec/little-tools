# Where the site lives. Everything reads this: the CloudFormation parameters,
# the publish step, the link on the root page. One string in one place, because
# the copies it used to have could drift without anything failing — the page
# would simply appear somewhere other than where it was advertised.
#
# Shell syntax, so deploy.sh can source it; simple KEY=value, so publish.py can
# read it without a parser. An environment variable of the same name wins, which
# is how the SITE_PREFIX repository variable overrides the path without a commit.

DOMAIN=little.tools
PREFIX=timetable

# Where the bucket lives, and the stacks that are only bookkeeping. CloudFront,
# Route 53 and IAM are global; the certificate is pinned to us-east-1 because
# CloudFront will not read one from anywhere else.
REGION=eu-central-1
