<!doctype html>
<meta charset="utf-8">
<title>little.tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 12vh 24px; font: 16px/1.6 -apple-system, BlinkMacSystemFont,
         "Segoe UI", Roboto, Arial, sans-serif; background: #fbfbfc; color: #14171a; }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  p.lede { color: #6b7280; margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border: 1px solid #e3e6ea; border-radius: 10px; background: #fff; margin-bottom: 12px; }
  a.tool { display: block; padding: 14px 16px; text-decoration: none; color: inherit; }
  a.tool:hover { border-color: #2d6cdf; }
  a.tool .name { font-weight: 600; color: #2d6cdf; }
  a.tool .what { color: #6b7280; font-size: 14px; }
  footer { margin-top: 40px; color: #9aa1ab; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    body { background: #14171a; color: #e8eaed; }
    li { background: #1c2024; border-color: #2b3138; }
    a.tool .name { color: #7aa7f0; }
    p.lede, a.tool .what, footer { color: #9aa1ab; }
  }
</style>
<main>
  <h1>little.tools</h1>
  <p class="lede">Small things, put somewhere they can be linked to.</p>
  <ul>
    <li><a class="tool" href="/__PREFIX__/">
      <span class="name">TERA timetable</span><br>
      <span class="what">A school timetable you can filter to one student's groups,
      draw to scale, add your own events to, and print on one sheet.</span>
    </a></li>
  </ul>
  <footer>Unofficial tools. Each page names its own source.</footer>
</main>
